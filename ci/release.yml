docker-build:
  stage: build
  image: docker:25
  services:
    - name: docker:25-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  cache: []
  before_script: []
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:ci-$CI_COMMIT_SHORT_SHA" .
    - docker save "$CI_REGISTRY_IMAGE:ci-$CI_COMMIT_SHORT_SHA" -o image.tar
  artifacts:
    paths:
      - image.tar
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      <<: *code_changes
    - if: '$CI_COMMIT_TAG'

docker-push:
  stage: push
  image: docker:25
  services:
    - name: docker:25-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  cache: []
  before_script: []
  needs:
    - job: docker-build
      artifacts: true
  script:
    - docker load -i image.tar
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      if [ -z "$CI_COMMIT_TAG" ]; then
        docker push "$CI_REGISTRY_IMAGE:ci-$CI_COMMIT_SHORT_SHA"
        docker tag "$CI_REGISTRY_IMAGE:ci-$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker push "$CI_REGISTRY_IMAGE:ci-$CI_COMMIT_SHORT_SHA"
        docker tag "$CI_REGISTRY_IMAGE:ci-$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      <<: *code_changes
    - if: '$CI_COMMIT_TAG'

release:
  stage: push
  image: alpine:3.20
  needs:
    - docker-push
  script:
    - apk add --no-cache curl
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        curl --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
          --data "name=$CI_COMMIT_TAG" \
          --data "tag_name=$CI_COMMIT_TAG" \
          --data "description=Release $CI_COMMIT_TAG" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
      else
        echo "no tag, skipping release"
      fi
  rules:
    - if: '$CI_COMMIT_TAG'
