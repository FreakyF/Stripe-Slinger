.code_changes: &code_changes
  changes:
    - "**/*.rs"
    - "**/Cargo.toml"
    - "**/Cargo.lock"
    - Dockerfile
    - .gitlab-ci.yml
    - ci/**/*

.common_branch_rules: &common_branch_rules
  - if: '$CI_COMMIT_BRANCH == "master"'
  - if: '$CI_COMMIT_BRANCH == "develop"'
  - if: '$CI_COMMIT_BRANCH =~ /^feature\//'
