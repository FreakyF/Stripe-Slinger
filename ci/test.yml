test:
  stage: test
  needs: ["clippy"]
  image: rust:1.85
  script:
    - cargo install cargo-nextest --locked --version 0.9.100 || true
    - export RUSTFLAGS="-C instrument-coverage"
    - export LLVM_PROFILE_FILE="$CI_PROJECT_DIR/coverage-%p-%m.profraw"
    - cargo nextest run --workspace --all-features --profile ci --junit-output junit.xml
  artifacts:
    reports:
      junit: junit.xml
    paths:
      - coverage-*.profraw
      - target/debug/
    expire_in: 1 day
