test:shard-0:
  extends: .rust-changes
  stage: test
  variables:
    SHARD: "0"
  script:
    - mkdir -p target/nextest/ci
    - mkdir -p target/llvm-cov-0
    - cargo llvm-cov nextest \
        --workspace --all-features \
        --no-report \
        --output-path target/llvm-cov-0 \
        --partition count:2:0 \
        -- --junit target/nextest/ci/junit-0.xml
  artifacts:
    reports:
      junit: target/nextest/ci/junit-0.xml
    paths:
      - target/llvm-cov-0/
      - target/nextest/ci/junit-0.xml
    expire_in: 1 day

test:shard-1:
  extends: .rust-changes
  stage: test
  variables:
    SHARD: "1"
  script:
    - mkdir -p target/nextest/ci
    - mkdir -p target/llvm-cov-1
    - cargo llvm-cov nextest \
        --workspace --all-features \
        --no-report \
        --output-path target/llvm-cov-1 \
        --partition count:2:1 \
        -- --junit target/nextest/ci/junit-1.xml
  artifacts:
    reports:
      junit: target/nextest/ci/junit-1.xml
    paths:
      - target/llvm-cov-1/
      - target/nextest/ci/junit-1.xml
    expire_in: 1 day
