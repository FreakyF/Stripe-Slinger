.test_template:
  stage: test
  artifacts:
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH =~ /^feature\//'
      <<: *code_changes

test:shard-0:
  extends: .test_template
  script:
    - mkdir -p target/nextest/ci
    - mkdir -p target/llvm-cov-0
    - cargo llvm-cov nextest \
        --workspace --all-features \
        --no-report \
        --output-path target/llvm-cov-0 \
        --partition count:2:0 \
        -- --junit target/nextest/ci/junit-0.xml
  artifacts:
    reports:
      junit: target/nextest/ci/junit-0.xml
    paths:
      - target/llvm-cov-0/
      - target/nextest/ci/junit-0.xml

test:shard-1:
  extends: .test_template
  script:
    - mkdir -p target/nextest/ci
    - mkdir -p target/llvm-cov-1
    - cargo llvm-cov nextest \
        --workspace --all-features \
        --no-report \
        --output-path target/llvm-cov-1 \
        --partition count:2:1 \
        -- --junit target/nextest/ci/junit-1.xml
  artifacts:
    reports:
      junit: target/nextest/ci/junit-1.xml
    paths:
      - target/llvm-cov-1/
      - target/nextest/ci/junit-1.xml
