test:
  stage: test
  needs: ["clippy"]
  image: rust:1.85
  script:
    - cargo install cargo2junit --locked || true
    - export RUSTFLAGS="-C instrument-coverage"
    - export LLVM_PROFILE_FILE="$CI_PROJECT_DIR/coverage-%p-%m.profraw"
    - set -o pipefail
    - cargo test --workspace --all-features -- --nocapture | cargo2junit > junit.xml
  artifacts:
    reports:
      junit: junit.xml
    paths:
      - coverage-*.profraw
      - target/debug/
    expire_in: 1 day
