coverage-raid-rs:
  stage: coverage
  needs:
    - { job: test:shard-0, artifacts: true }
    - { job: test:shard-1, artifacts: true }
  cache:
    key: "rust-${CI_COMMIT_REF_SLUG}"
    policy: pull
    paths:
      - target
      - .cargo/registry
      - .cargo/git
  script: |
    set -e
    mkdir -p target/llvm-cov
    cp -r target/llvm-cov-0/* target/llvm-cov/ 2>/dev/null || true
    cp -r target/llvm-cov-1/* target/llvm-cov/ 2>/dev/null || true

    mkdir -p reports
    cargo llvm-cov report \
      --package raid-rs \
      --cobertura --output-path reports/coverage-raid-rs.xml \
      --ignore-filename-regex='/.cargo/|/rustc/'

    LINES=$(cargo llvm-cov report --package raid-rs --summary-only | awk '/^Lines:/ {gsub("%","",$2); print $2}')
    echo "raid-rs lines: ${LINES}%"
    THRESHOLD=75
    if [ "$CI_COMMIT_BRANCH" = "master" ]; then
      awk -v l="${LINES}" -v t="${THRESHOLD}" 'BEGIN { if (l+0 < t+0) exit 1 }'
    fi
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage-raid-rs.xml
    paths:
      - reports/coverage-raid-rs.xml
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
      allow_failure: true
      <<: *code_changes
    - if: '$CI_COMMIT_BRANCH =~ /^feature\//'
      allow_failure: true
      <<: *code_changes

