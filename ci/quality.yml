cargo-audit:
  stage: coverage
  needs:
    - test:shard-0
    - test:shard-1
  cache:
    key: "rust-${CI_COMMIT_REF_SLUG}"
    policy: pull
    paths:
      - target
      - .cargo/registry
      - .cargo/git
  script:
    - mkdir -p reports
    - cargo audit --json > reports/audit.json
  artifacts:
    paths:
      - reports/audit.json
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
      allow_failure: true
      <<: *code_changes
    - if: '$CI_COMMIT_BRANCH =~ /^feature\//'
      allow_failure: true
      <<: *code_changes
