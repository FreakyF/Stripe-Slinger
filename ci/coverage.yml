coverage-lib:
  stage: coverage
  image: rust:1.85
  needs:
    - job: test
      artifacts: true
  script:
    - apt-get update && apt-get install -y llvm
    - llvm-profdata merge -sparse coverage-*.profraw -o coverage.profdata
    - llvm-cov report \
        --ignore-filename-regex='/.cargo/|/rustc/' \
        target/debug/deps/raid_rs-* \
        --instr-profile=coverage.profdata

coverage-app:
  stage: coverage
  image: rust:1.85
  needs:
    - job: test
      artifacts: true
  script:
    - apt-get update && apt-get install -y llvm
    - llvm-profdata merge -sparse coverage-*.profraw -o coverage.profdata
    - llvm-cov report \
        --ignore-filename-regex='/.cargo/|/rustc/' \
        target/debug/deps/raid_cli-* \
        --instr-profile=coverage.profdata

