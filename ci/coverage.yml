coverage-lib:
  stage: coverage
  image: rust:1.85
  needs:
    - job: test
      artifacts: true
  script:
    - rustup component add llvm-tools-preview
    - SYSROOT=$(rustc --print sysroot)
    - 'HOST=$(rustc -vV | grep host | cut -d: -f2 | xargs)'
    - LLVM_BIN="$SYSROOT/lib/rustlib/$HOST/bin"
    - "$LLVM_BIN/llvm-profdata" merge -sparse coverage-*.profraw -o coverage.profdata
    - "$LLVM_BIN/llvm-cov" report --ignore-filename-regex='/.cargo/|/rustc/' target/debug/deps/raid_rs-* --instr-profile=coverage.profdata

coverage-app:
  stage: coverage
  image: rust:1.85
  needs:
    - job: test
      artifacts: true
  script:
    - rustup component add llvm-tools-preview
    - SYSROOT=$(rustc --print sysroot)
    - HOST=$(rustc -vV | grep host | cut -d: -f2 | xargs)
    - LLVM_BIN="$SYSROOT/lib/rustlib/$HOST/bin"
    - "$LLVM_BIN/llvm-profdata" merge -sparse coverage-*.profraw -o coverage.profdata
    - "$LLVM_BIN/llvm-cov" report --ignore-filename-regex='/.cargo/|/rustc/' target/debug/deps/raid_cli-* --instr-profile=coverage.profdata

