coverage-lib:
  stage: coverage
  script:
    - cargo install cargo-tarpaulin --locked || true
    - cargo tarpaulin -p raid-rs --all-features --fail-under 80

coverage-app:
  stage: coverage
  script:
    - cargo install cargo-tarpaulin --locked || true
    - cargo tarpaulin -p raid-cli --all-features --fail-under 60
