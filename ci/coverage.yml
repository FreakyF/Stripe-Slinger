coverage-lib:
  stage: coverage
  image: rust:1.85
  script:
    - cargo install cargo-llvm-cov --locked || true
    - cargo llvm-cov --package raid-rs --all-features --fail-under-lines 0

coverage-app:
  stage: coverage
  image: rust:1.85
  script:
    - cargo install cargo-llvm-cov --locked || true
    - cargo llvm-cov --package raid-cli --all-features --fail-under-lines 0
