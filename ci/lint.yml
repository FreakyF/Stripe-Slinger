fmt:
  stage: lint
  script:
    - cargo +nightly fmt --all -- --check

clippy:
  stage: lint
  script:
    - cargo +nightly clippy --workspace --all-targets --all-features -- \
        -D clippy::correctness \
        -D clippy::suspicious \
        -A dead_code \
        -A unused_variables \
        -A unused_mut

