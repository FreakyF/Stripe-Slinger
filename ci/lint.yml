fmt:
  extends: .rust-changes
  stage: lint
  script:
    - cargo fmt --all -- --check

clippy:
  extends: .rust-changes
  stage: lint
  script:
    - |
      cargo clippy --workspace --all-targets --all-features -- \
        -D clippy::correctness \
        -D clippy::suspicious \
        -A dead_code \
        -A unused_variables \
        -A unused_mut
