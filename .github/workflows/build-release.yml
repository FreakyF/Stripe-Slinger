name: Build and Release

on:
  workflow_call:
    inputs:
      repo_lower:
        required: true
        type: string
      is_tag:
        required: true
        type: boolean
      is_master:
        required: true
        type: boolean
      build_go:
        required: true
        type: boolean
      build_rust:
        required: true
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  raid-simulator-image:
    if: ${{ inputs.build_rust }}
    runs-on: ubuntu-latest
    env:
      CI_REGISTRY: ghcr.io
      CI_REGISTRY_IMAGE: ghcr.io/${{ inputs.repo_lower }}
      CI_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      CI_REGISTRY_USER: ${{ github.actor }}
      CI_JOB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE_NAME: "raid-simulator"
      DOCKER_BUILD_CONTEXT: "."
      DOCKERFILE_PATH: "services/raid-simulator/Dockerfile"
      CI_COMMIT_SHORT_SHA: ${{ github.sha }}
      CI_COMMIT_BRANCH: ${{ github.ref_name }}
      CI_COMMIT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Patch scripts for GHCR
        run: sed -i 's/gitlab-ci-token/${CI_REGISTRY_USER}/g' .gitlab/ci/shared/scripts/*.sh
      - name: Truncate SHA
        run: echo "CI_COMMIT_SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV
      - name: Build and Push
        run: .gitlab/ci/shared/scripts/docker-build-and-push.sh

  metrics-gateway-image:
    if: ${{ inputs.build_go }}
    runs-on: ubuntu-latest
    env:
      CI_REGISTRY: ghcr.io
      CI_REGISTRY_IMAGE: ghcr.io/${{ inputs.repo_lower }}
      CI_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      CI_REGISTRY_USER: ${{ github.actor }}
      CI_JOB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE_NAME: "metrics-gateway"
      DOCKER_BUILD_CONTEXT: "."
      DOCKERFILE_PATH: "services/metrics-gateway/Dockerfile"
      CI_COMMIT_SHORT_SHA: ${{ github.sha }}
      CI_COMMIT_BRANCH: ${{ github.ref_name }}
      CI_COMMIT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Patch scripts for GHCR
        run: sed -i 's/gitlab-ci-token/${CI_REGISTRY_USER}/g' .gitlab/ci/shared/scripts/*.sh
      - name: Truncate SHA
        run: echo "CI_COMMIT_SHORT_SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV
      - name: Build and Push
        run: .gitlab/ci/shared/scripts/docker-build-and-push.sh

  release:
    needs: [raid-simulator-image, metrics-gateway-image]
    # needs behaves as 'wait for if exists', but if skipped due to inputs, it's fine.
    if: ${{ inputs.is_tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --notes "Release ${{ github.ref_name }}"
